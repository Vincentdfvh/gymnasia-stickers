<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gymnasia Stickers</title>
<meta name="description" content="La carte du monde des stickers Gymnasia : qui a collé quoi, où.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --ink: #05070c;
    --blue: #2563ff;
    --blue-hi: #5b8cff;
    --blue-lo: #0d2a80;
    --panel: rgba(4, 6, 12, 0.86);
    --line: rgba(91, 140, 255, 0.16);
    --line-soft: rgba(255,255,255,0.06);
    --text: #eef2fb;
    --muted: #7d879f;
    --display: "Space Grotesk", Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; color: var(--text); overflow: hidden;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at 65% 50%, #07112e 0%, #020409 55%, #000 100%); }
  #globe { position: fixed; top: 0; left: 0; }

  /* stripes black | blue | black */
  .stripes { display: inline-grid; grid-template-columns: 1fr 1fr 1fr; overflow: hidden; flex-shrink: 0; }
  .stripes > i:nth-child(1), .stripes > i:nth-child(3) { background: var(--black); }
  .stripes > i:nth-child(2) { background: var(--blue); box-shadow: 0 0 18px var(--blue); }

  .panel {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 356px; z-index: 5;
    background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 20px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .panel::before { /* blue band down the middle of a black top bar */
    content: ""; display: block; height: 5px; flex-shrink: 0;
    background: linear-gradient(90deg, #000 0 33.3%, var(--blue) 33.3% 66.6%, #000 66.6%);
  }
  .panel header { padding: 18px 22px 14px; display: flex; gap: 14px; align-items: center;
                  border-bottom: 1px solid var(--line-soft); position: relative; }
  .crest { width: 44px; height: 52px; border-radius: 6px 6px 22px 22px; border: 1.5px solid var(--blue-hi);
           box-shadow: 0 0 24px rgba(37,99,255,0.35); }
  .panel h1 { margin: 0; font-family: var(--display); font-size: 25px; font-weight: 700;
              letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; }
  .panel .tag { font-family: var(--display); font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase;
                color: var(--blue-hi); margin-top: 6px; font-weight: 500; }
  .scroll { overflow-y: auto; padding: 4px 22px 22px; flex: 1; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(91,140,255,0.2); border-radius: 3px; }

  h2 { font-family: var(--display); font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;
       color: var(--muted); font-weight: 500; margin: 24px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

  .big { display: flex; align-items: baseline; gap: 10px; }
  .big b { font-family: var(--display); font-size: 60px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
           color: #fff; text-shadow: 0 0 30px rgba(37,99,255,0.55); }
  .big small { color: var(--muted); font-size: 13px; line-height: 1.4; }
  .big small b { color: var(--text); font: 600 13px Inter, sans-serif; text-shadow: none; letter-spacing: 0; }
  .bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; background: var(--blue); box-shadow: 0 0 12px var(--blue); border-radius: 2px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: linear-gradient(180deg, rgba(37,99,255,0.07), rgba(37,99,255,0.015));
          border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; }
  .stat.wide { grid-column: span 2; }
  .stat.hero { background: linear-gradient(135deg, rgba(37,99,255,0.28), rgba(13,42,128,0.12)); border-color: rgba(91,140,255,0.4); }
  .stat .label { font-size: 11px; color: var(--muted); }
  .stat .value { font-family: var(--display); font-size: 19px; font-weight: 700; margin-top: 3px; letter-spacing: -0.01em; }
  .stat.hero .value { font-size: 26px; }
  .stat .who { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .stat .who i { font-style: normal; font-weight: 600; }

  .people { display: flex; flex-direction: column; gap: 2px; }
  .person { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px;
            cursor: pointer; border: 1px solid transparent; transition: background .15s, border-color .15s; }
  .person:hover { background: rgba(37,99,255,0.08); }
  .person.active { background: rgba(37,99,255,0.16); border-color: rgba(91,140,255,0.45); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,0.06); }
  .person .name { font-weight: 600; font-size: 14px; flex: 1; }
  .person .flags { font-size: 12px; color: var(--muted); display: block; font-weight: 400; margin-top: 2px; }
  .person .count { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--blue-hi); }
  .person .count small { font: 400 11px Inter, sans-serif; color: var(--muted); margin-left: 2px; }

  .countries { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 6px 10px; border-radius: 999px; background: rgba(37,99,255,0.08);
          border: 1px solid var(--line); cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
          transition: background .15s; }
  .chip:hover { background: rgba(37,99,255,0.22); }
  .chip .dot { width: 6px; height: 6px; box-shadow: none; }

  .card {
    position: fixed; right: 16px; top: 16px; width: 310px; z-index: 6; overflow: hidden;
    background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 18px; padding: 0 20px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transform: translateY(-8px); opacity: 0; pointer-events: none; transition: all .22s;
  }
  .card::before { content: ""; display: block; height: 4px; margin: 0 -20px 16px;
    background: linear-gradient(90deg, #000 0 33.3%, var(--blue) 33.3% 66.6%, #000 66.6%); }
  .card.show { transform: none; opacity: 1; pointer-events: auto; }
  .card h3 { margin: 0 0 2px; font-family: var(--display); font-size: 24px; letter-spacing: -0.01em; }
  .card .close { position: absolute; top: 14px; right: 14px; background: rgba(255,255,255,0.06); border: none;
                 color: var(--muted); width: 28px; height: 28px; border-radius: 50%; font-size: 17px; cursor: pointer; }
  .card .close:hover { color: var(--text); background: rgba(255,255,255,0.12); }
  .card .none { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .card .entry { display: flex; gap: 12px; align-items: flex-start; margin-top: 12px; font-size: 14px;
                 padding-top: 12px; border-top: 1px solid var(--line-soft); }
  .card .entry .dot { margin-top: 5px; }
  .card .entry small { color: var(--muted); display: block; margin-top: 2px; }

  .tooltip { background: rgba(2,4,10,0.94); border: 1px solid var(--line); padding: 7px 11px; border-radius: 10px;
             font: 500 13px Inter, sans-serif; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  .tooltip b { font-family: var(--display); }
  .tooltip small { color: var(--muted); }

  .hint { position: fixed; bottom: 18px; right: 20px; font-size: 12px; color: var(--muted); z-index: 4;
          letter-spacing: 0.02em; }
  .reset { margin-top: 10px; font-size: 12px; color: var(--blue-hi); background: none; border: none; cursor: pointer;
           padding: 0; display: none; }
  .reset.show { display: inline; }
  .toggle { display: none; }


  /* ---------- actions ---------- */
  .fab { position: fixed; right: 20px; bottom: 20px; z-index: 7; display: flex; gap: 8px; }
  .btn { font: 600 13px Inter, sans-serif; color: var(--text); background: rgba(37,99,255,0.12);
         border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer;
         transition: background .15s, transform .1s; white-space: nowrap; }
  .btn:hover { background: rgba(37,99,255,0.25); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 6px 24px rgba(37,99,255,0.45); }
  .btn.primary:hover { background: #3b74ff; }
  .fab .btn { padding: 12px 18px; font-size: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .fab .btn:not(.primary) { background: var(--panel); }
  .hint { right: auto; left: 404px; }

  .banner { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 4; display: none;
            font-size: 12px; color: #ffd27a; background: rgba(40,28,0,0.7); border: 1px solid rgba(255,200,80,0.3);
            padding: 6px 12px; border-radius: 999px; margin-left: 194px; white-space: nowrap; }
  .banner.show { display: block; }

  .toast { position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 20px); z-index: 30; opacity: 0;
           background: #0b1430; border: 1px solid rgba(91,140,255,0.5); color: var(--text); padding: 10px 16px;
           border-radius: 12px; font-size: 14px; transition: all .2s; pointer-events: none; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: #2a0d12; border-color: rgba(255,107,107,0.5); }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
           -webkit-backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal.show { display: flex; }
  .modal-box { position: relative; width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto;
               background: #060912; border: 1px solid var(--line); border-radius: 20px; padding: 0 22px 22px;
               box-shadow: 0 30px 80px rgba(0,0,0,0.7); }
  .modal-box::before { content: ""; display: block; height: 5px; margin: 0 -22px 18px; position: sticky; top: 0; z-index: 1;
    background: linear-gradient(90deg, #000 0 33.3%, var(--blue) 33.3% 66.6%, #000 66.6%); }
  .modal-box h3 { margin: 0 0 6px; font-family: var(--display); font-size: 24px; }
  .modal-box .close, .card .close { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.06); border: none;
                 color: var(--muted); width: 30px; height: 30px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 2; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
  input[type=text], input[type=password], input[type=number], input:not([type]), select {
    width: 100%; font: 500 14px Inter, sans-serif; color: var(--text); background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 12px; outline: none; }
  input:focus, select:focus { border-color: var(--blue-hi); box-shadow: 0 0 0 3px rgba(37,99,255,0.25); }
  select option { background: #0b1020; }
  input[type=color] { width: 38px; height: 38px; padding: 0; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
                      background: none; cursor: pointer; flex-shrink: 0; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 3px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 7px; }
  .field { display: block; margin-top: 16px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field em { font-style: normal; font-weight: 400; opacity: .7; }
  .field-row { display: flex; gap: 12px; align-items: flex-end; }
  .field-row .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; padding-bottom: 11px; cursor: pointer; white-space: nowrap; }
  .check input { width: 16px; height: 16px; accent-color: var(--blue); }
  .loc { padding: 10px 12px; border-radius: 10px; border: 1px dashed rgba(255,255,255,0.15); font-size: 14px; }
  .loc.set { border-style: solid; border-color: rgba(91,140,255,0.5); background: rgba(37,99,255,0.1); }
  .loc small { color: var(--muted); margin-left: 4px; }
  .loc-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .search { display: flex; gap: 8px; margin-top: 8px; }
  .results { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .result { text-align: left; font: 13px Inter, sans-serif; color: var(--text); background: rgba(255,255,255,0.03);
            border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .result:hover { background: rgba(37,99,255,0.18); }
  .photo-drop { display: flex; align-items: center; justify-content: center; min-height: 90px; border-radius: 12px;
                border: 1px dashed rgba(91,140,255,0.4); cursor: pointer; overflow: hidden; color: var(--muted); font-size: 14px; }
  .photo-drop:hover { background: rgba(37,99,255,0.08); }
  .photo-drop img { width: 100%; max-height: 240px; object-fit: cover; display: block; }
  .big-btn { width: 100%; margin-top: 20px; padding: 13px; font-size: 15px; border-radius: 12px; }
  .members { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .member, .add-row { display: flex; gap: 8px; align-items: center; }
  .add-row { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .members + .add-row { margin-top: 16px; }
  .saved { color: #4ade80; opacity: 0; transition: opacity .2s; width: 14px; }
  .saved.show { opacity: 1; }

  /* ---------- card photos ---------- */
  .card { max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .card .entries { overflow-y: auto; margin: 0 -20px; padding: 0 20px; }
  .entry-body { flex: 1; min-width: 0; }
  .photo { margin-top: 8px; border-radius: 10px; overflow: hidden; cursor: zoom-in; background: rgba(255,255,255,0.04); }
  .photo img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
  .photo.loading { height: 120px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }
  .link { display: inline-block; margin-top: 6px; margin-right: 12px; font: 600 12px Inter, sans-serif; color: var(--blue-hi);
          background: none; border: none; padding: 0; cursor: pointer; }
  .link.danger { color: #8b93a7; font-weight: 500; }
  .link.danger:hover { color: #ff6b6b; }
  .lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.92); display: none; align-items: center;
              justify-content: center; cursor: zoom-out; padding: 20px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* ---------- pick mode ---------- */
  .pickbar { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -80px); z-index: 15; transition: transform .25s;
             display: flex; align-items: center; gap: 12px; background: var(--blue); color: #fff; padding: 10px 10px 10px 18px;
             border-radius: 999px; box-shadow: 0 10px 40px rgba(37,99,255,0.5); font-weight: 600; font-size: 14px; margin-left: 194px; }
  .pickbar { visibility: hidden; opacity: 0; }
  .pickbar.show { transform: translate(-50%, 0); visibility: visible; opacity: 1; }
  .pickbar .btn { background: rgba(0,0,0,0.3); border-color: transparent; }
  body.picking .panel, body.picking .fab, body.picking .hint { opacity: .25; pointer-events: none; }

  @media (max-width: 760px) {
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 48vh; transition: height .25s; }
    .panel.collapsed { height: 92px; }
    .panel header { padding: 12px 16px; }
    .crest { width: 34px; height: 40px; }
    .panel h1 { font-size: 20px; }
    .panel .tag { letter-spacing: 0.18em; font-size: 11px; }
    .panel header { padding-right: 96px; }
    .scroll { padding: 0 16px 16px; }
    .big b { font-size: 48px; }
    .toggle { display: block; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
              background: rgba(37,99,255,0.15); border: 1px solid var(--line); color: var(--text);
              border-radius: 999px; padding: 6px 12px; font-size: 12px; }
    .card { left: 8px; right: 8px; top: 8px; width: auto; }
    .hint { display: none; }
    #globe { top: 0; transition: transform .3s ease; }
    .fab { top: 10px; right: 10px; bottom: auto; }
    .fab .btn { padding: 9px 13px; font-size: 13px; }
    .banner { top: auto; bottom: calc(48vh + 16px); margin-left: 0; white-space: nowrap; }
    .pickbar { margin-left: 0; top: 12px; font-size: 13px; width: calc(100vw - 24px); justify-content: space-between; }
    .toast { bottom: calc(48vh + 20px); }
    .card { top: 58px; max-height: calc(52vh - 70px); }
  }
</style>
</head>
<body>
<div id="globe"></div>

<aside class="panel" id="panel">
  <header>
    <span class="stripes crest" aria-hidden="true"><i></i><i></i><i></i></span>
    <div>
      <h1>Gymnasia</h1>
      <div class="tag">Stickers · World Tour</div>
    </div>
    <button class="toggle" id="toggle">Réduire</button>
  </header>
  <div class="scroll">
    <h2>Conquête du monde</h2>
    <div class="big"><b id="nCountries">0</b><small id="nCountriesSub"></small></div>
    <div class="bar"><div id="worldBar"></div></div>

    <h2>Records</h2>
    <div class="grid" id="records"></div>

    <h2>Les stickeurs</h2>
    <div class="people" id="people"></div>
    <button class="reset" id="reset">Tout afficher</button>

    <h2>Pays stickés</h2>
    <div class="countries" id="countryList"></div>
  </div>
</aside>

<div class="card" id="card"></div>
<div class="fab">
  <button class="btn" id="membersBtn">👥 Membres</button>
  <button class="btn primary" id="addBtn">＋ Sticker</button>
</div>
<div class="banner" id="localBanner">Mode local : les modifs ne sont visibles que sur cet appareil</div>
<div class="pickbar" id="pickBar">Clique sur le globe là où le sticker est collé <button class="btn" id="pickCancel">Annuler</button></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="lightbox" id="lightbox"></div>
<div class="toast" id="toast"></div>
<div class="hint">Glisse pour tourner · molette pour zoomer · clique un pays</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="config.js"></script>
<script src="countries-meta.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
