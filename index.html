<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gymnasia Stickers</title>
<meta name="description" content="La carte du monde des stickers Gymnasia : qui a collé quoi, où.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --panel: rgba(14, 18, 30, 0.82);
    --border: rgba(255,255,255,0.09);
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; overflow: hidden; }
  #globe { position: fixed; inset: 0; }

  .panel {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 340px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 18px;
    display: flex; flex-direction: column; overflow: hidden; z-index: 5;
  }
  .panel header { padding: 20px 20px 12px; }
  .panel h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .panel h1 span { color: var(--accent); }
  .panel .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .scroll { overflow-y: auto; padding: 0 20px 20px; flex: 1; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
       font-weight: 600; margin: 22px 0 10px; }

  .big { display: flex; align-items: baseline; gap: 8px; }
  .big b { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; }
  .big small { color: var(--muted); font-size: 14px; }
  .bar { height: 6px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #4ade80, #38bdf8); border-radius: 3px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .stat.wide { grid-column: span 2; }
  .stat .label { font-size: 11px; color: var(--muted); }
  .stat .value { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .stat .who { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat .who i { font-style: normal; font-weight: 600; }

  .people { display: flex; flex-direction: column; gap: 4px; }
  .person { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
            cursor: pointer; border: 1px solid transparent; transition: background .15s; }
  .person:hover { background: rgba(255,255,255,0.05); }
  .person.active { background: rgba(255,255,255,0.08); border-color: var(--border); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
  .person .name { font-weight: 600; font-size: 14px; flex: 1; }
  .person .count { font-size: 12px; color: var(--muted); }
  .person .flags { font-size: 12px; color: var(--muted); display: block; font-weight: 400; margin-top: 1px; }

  .countries { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,0.05);
          border: 1px solid var(--border); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { background: rgba(255,255,255,0.1); }
  .chip .dot { width: 7px; height: 7px; box-shadow: none; }

  .card {
    position: fixed; right: 16px; top: 16px; width: 300px; z-index: 6;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px;
    transform: translateY(-8px); opacity: 0; pointer-events: none; transition: all .2s;
  }
  .card.show { transform: none; opacity: 1; pointer-events: auto; }
  .card h3 { margin: 0 0 4px; font-size: 20px; }
  .card .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted);
                 font-size: 20px; cursor: pointer; }
  .card .none { color: var(--muted); font-size: 14px; }
  .card .entry { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; font-size: 14px; }
  .card .entry .dot { margin-top: 4px; }
  .card .entry small { color: var(--muted); display: block; }

  .tooltip { background: rgba(10,12,20,0.92); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px;
             font: 500 13px Inter, sans-serif; color: var(--text); }
  .tooltip small { color: var(--muted); }

  .hint { position: fixed; bottom: 16px; right: 16px; font-size: 12px; color: var(--muted); z-index: 4; }
  .reset { margin-top: 8px; font-size: 12px; color: var(--muted); background: none; border: none; cursor: pointer;
           padding: 0; text-decoration: underline; display: none; }
  .reset.show { display: inline; }
  .toggle { display: none; }

  @media (max-width: 760px) {
    .panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 46vh; transition: height .25s; }
    .panel.collapsed { height: 112px; }
    .panel header { padding: 14px 16px 8px; position: relative; }
    .scroll { padding: 0 16px 16px; }
    .toggle { display: block; position: absolute; right: 12px; top: 12px; background: rgba(255,255,255,0.08);
              border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 12px; }
    .card { left: 8px; right: 8px; top: 8px; width: auto; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="globe"></div>

<aside class="panel" id="panel">
  <header>
    <h1>Gymnasia <span>Stickers</span></h1>
    <div class="sub">Partout où un membre du club a collé un sticker.</div>
    <button class="toggle" id="toggle">Réduire</button>
  </header>
  <div class="scroll">
    <h2>Conquête du monde</h2>
    <div class="big"><b id="nCountries">0</b><small id="nCountriesSub"></small></div>
    <div class="bar"><div id="worldBar"></div></div>

    <h2>Records</h2>
    <div class="grid" id="records"></div>

    <h2>Les stickeurs</h2>
    <div class="people" id="people"></div>
    <button class="reset" id="reset">Tout afficher</button>

    <h2>Pays stickés</h2>
    <div class="countries" id="countryList"></div>
  </div>
</aside>

<div class="card" id="card"></div>
<div class="hint">Glisse pour tourner · molette pour zoomer · clique un pays</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
